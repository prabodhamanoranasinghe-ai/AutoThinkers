name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-hosting
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://autothinkers.com
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyD2Dq-gZilLAsq65TCsRkD9MuF6wS8nYy0
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: autothinkers-75ab4.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: autothinkers-75ab4
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: autothinkers-75ab4.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "426150303298"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:426150303298:web:0278480ca48a64b0633fdb
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-3RXNQ16NKV
        run: bash scripts/build-github-pages.sh

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project autothinkers-75ab4 --non-interactive
