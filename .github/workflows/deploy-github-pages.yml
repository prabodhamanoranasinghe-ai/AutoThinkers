name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Keep separate from GitHub's built-in "pages" deploy group so we do not
  # cancel in-flight pages-build-deployment runs.
  group: deploy-gh-pages-branch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          # Custom domain serves from site root (no /AutoThinkers prefix)
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://autothinkers.com
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyD2Dq-gZilLAsq65TCsRkD9MuF6wS8nYy0
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: autothinkers-75ab4.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: autothinkers-75ab4
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: autothinkers-75ab4.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "426150303298"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:426150303298:web:0278480ca48a64b0633fdb
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-3RXNQ16NKV
        run: bash scripts/build-github-pages.sh

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: autothinkers.com
