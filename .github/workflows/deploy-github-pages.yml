name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-gh-pages-branch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          # Custom domain serves from site root (no /AutoThinkers prefix)
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://autothinkers.com
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyC2q9twJjJJIZWfYjBTLa9tYr_GoolReho
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: autothinkers-d7b0b.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: autothinkers-d7b0b
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: autothinkers-d7b0b.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "712474165644"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:712474165644:web:6e266eb6eebde1333cd6a9
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-QLRDQZ9SDF
        run: bash scripts/build-github-pages.sh

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: autothinkers.com
