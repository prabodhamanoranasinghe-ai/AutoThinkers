      <stop offset="0%" stop-color="#071820"/>
      <stop offset="45%" stop-color="#123744"/>
      <stop offset="100%" stop-color="#1F5A4E"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#C4784A" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C4784A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- storefront -->
  <g fill="none" stroke="#E8EEF2" stroke-opacity="0.3" stroke-width="2.5">
