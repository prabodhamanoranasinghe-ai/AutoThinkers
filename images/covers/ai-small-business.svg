  <text x="220" y="160" fill="#E8EEF2" font-family="Georgia, serif" font-size="46" opacity="0.92">AI for Small Business</text>
  <rect x="220" y="720" width="280" height="8" rx="4" fill="#C4784A" opacity="0.8"/>
